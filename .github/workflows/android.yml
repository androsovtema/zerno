name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: zerno-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
      - name: Publish APK (постоянная ссылка)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zerno.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build zerno.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Zerno — тестовая сборка" \
            --notes "Сборка из ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC'). Ставится поверх предыдущей."
